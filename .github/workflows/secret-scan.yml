# .github/workflows/secret-scan.yml
# Calls the organization's central secret-scanning workflow.
# Do not modify this file — it is managed centrally by the security team.

name: Secret Scan

on:
  pull_request:

# The called reusable workflow requests these scopes; a caller can only pass down
# permissions it already holds, so they must be granted here too.
permissions:
  contents: read
  pull-requests: read

jobs:
  scan:
    uses: whitetie-org/security-baseline/.github/workflows/secret-scan.yml@v1
    # Pin to a tagged version, not @main, so security can roll out changes deliberately.
