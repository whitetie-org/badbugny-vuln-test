# .github/workflows/secret-scan.yml
# Reusable workflow that scans for secrets with gitleaks and trufflehog.
# Called by per-repo workflows via `workflow_call`.

name: Secret Scan (Reusable)

on:
  workflow_call:
    inputs:
      gitleaks-version:
        description: 'Gitleaks version to use'
        required: false
        type: string
        default: '8.21.2'
      trufflehog-version:
        description: 'TruffleHog version to use'
        required: false
        type: string
        default: '3.83.7'
      fail-on-unverified:
        description: 'If true, TruffleHog blocks on unverified findings too'
        required: false
        type: boolean
        default: false

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history is required so the scanners can diff against the base ref
          fetch-depth: 0

      - name: Fetch shared gitleaks config
        run: |
          curl -sSL \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/${{ github.repository_owner }}/security-baseline/contents/configs/gitleaks.toml" \
            -o .gitleaks.toml
          echo "Loaded shared gitleaks config:"
          ls -la .gitleaks.toml

      - name: Install Gitleaks
        run: |
          VERSION="${{ inputs.gitleaks-version }}"
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Install TruffleHog
        run: |
          VERSION="${{ inputs.trufflehog-version }}"
          curl -sSL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${VERSION}/trufflehog_${VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trufflehog
          trufflehog --version

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            # On push events, github.event.before is the SHA before the push
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        id: gitleaks
        run: |
          set +e
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --no-banner \
            --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" \
            --exit-code 1
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Run TruffleHog
        if: always()  # Run even if gitleaks failed, so devs see all findings at once
        id: trufflehog
        run: |
          set +e
          ONLY_VERIFIED="--only-verified"
          if [ "${{ inputs.fail-on-unverified }}" = "true" ]; then
            ONLY_VERIFIED=""
          fi

          trufflehog git "file://." \
            --since-commit "${{ steps.range.outputs.base }}" \
            --branch "${{ steps.range.outputs.head }}" \
            $ONLY_VERIFIED \
            --fail \
            --no-update
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Report results
        if: failure()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ❌ Secret Scan Failed

          One or both scanners detected potential secrets in this change.

          **What to do now:**
          1. **Rotate any exposed credentials immediately** — assume they are compromised.
          2. Remove the secrets from your branch history (`git rebase -i` for recent commits, `git filter-repo` for older).
          3. Force-push the cleaned branch.
          4. Re-run this check.

          **Need a false positive added to the allowlist?** Open a PR against
          `your-org/security-baseline` updating `configs/gitleaks.toml`.

          **Need to bypass in an emergency?** Contact the security team. Do not merge a PR with a failing scan without explicit approval.
          EOF