repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.83.7
    hooks:
      - id: trufflehog
        name: TruffleHog
        # Scan only what's staged for commit, with verified-only to reduce noise
        entry: trufflehog git file://. --since-commit HEAD --fail
        language: golang
        pass_filenames: false